name: Precios diarios

on:
  schedule:
    - cron: '7 12 * * *'   # todos los días 09:07 hora argentina (12:07 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Leer precios de Uber
        id: scrape
        continue-on-error: true
        run: node scrape.mjs
      - name: Guardar datos
        run: |
          if git diff --quiet data/; then echo "Sin datos nuevos"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Precios $(TZ=America/Argentina/Buenos_Aires date +%F)"
          git push
      - name: Subir capturas para diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          retention-days: 14
      - name: Marcar falla si no se leyeron todos los precios
        if: steps.scrape.outcome == 'failure'
        run: exit 1
